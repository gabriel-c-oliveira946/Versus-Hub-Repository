<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/login/css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="shortcut icon" href="/image/logo.png" type="image/x-icon">
  <title>Redefinir Senha - VersusHub</title>
</head>
<body>
  <div class="container">
    <div class="form-box">
      <div class="avatar">
        <img referrerpolicy="no-referrer" src="/image/boneco_logo_ofc.png" alt="VersusHub Avatar">
      </div>
      <h2 id="cadastrop">Nova Senha</h2>
      <p style="color: #9ca3af; font-size: 13.5px; text-align: center; margin-top: -10px; margin-bottom: 20px;">
        Digite sua nova senha abaixo para recuperar seu acesso ao VersusHub.
      </p>

      <div id="resetMessage" class="login-feedback"></div>

      <form id="formResetPassword">
        <input type="password" id="newPassword" placeholder="Nova Senha (mínimo 6 caracteres)" minlength="6" required>
        <input type="password" id="confirmPassword" placeholder="Confirme a Nova Senha" minlength="6" required>
        <button type="submit" class="btn" id="btnSalvarNovaSenha">
          <i class="fa-solid fa-lock" style="margin-right: 6px;"></i>Salvar Nova Senha
        </button>
      </form>

      <a id="cliquecadastro" href="/login/login.html">Voltar para o Login</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/supabaseClient.js';

    const form = document.getElementById('formResetPassword');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const resetMessage = document.getElementById('resetMessage');
    const btnSalvar = document.getElementById('btnSalvarNovaSenha');

    function showMsg(text, type) {
      resetMessage.textContent = text;
      resetMessage.className = 'login-feedback ' + type;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!newPassword || newPassword.length < 6) {
        showMsg('A nova senha deve ter no mínimo 6 caracteres.', 'error');
        newPasswordInput.focus();
        return;
      }

      if (newPassword !== confirmPassword) {
        showMsg('As senhas digitadas não coincidem.', 'error');
        confirmPasswordInput.focus();
        return;
      }

      btnSalvar.disabled = true;
      btnSalvar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Atualizando senha...';

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: newPassword
        });

        if (error) {
          showMsg(error.message || 'Erro ao atualizar senha. O link pode ter expirado.', 'error');
          btnSalvar.disabled = false;
          btnSalvar.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 6px;"></i>Salvar Nova Senha';
          return;
        }

        showMsg('Senha alterada com sucesso! Redirecionando para o login...', 'success');
        setTimeout(() => {
          window.location.href = '/login/login.html';
        }, 2000);
      } catch (err) {
        console.error('Erro ao redefinir senha:', err);
        showMsg('Ocorreu um erro ao redefinir sua senha.', 'error');
        btnSalvar.disabled = false;
        btnSalvar.innerHTML = '<i class="fa-solid fa-lock" style="margin-right: 6px;"></i>Salvar Nova Senha';
      }
    });
  </script>
</body>
</html>
